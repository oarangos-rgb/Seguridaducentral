<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo} + ' - UCentral Segura'">Guía</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Open Sans', sans-serif; background: #f4f6f9; margin: 0; color: #2b2b3a; }
        .guide-detail-container { max-width: 760px; margin: 60px auto; background: #fff; padding: 40px 48px;
            border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #0056b3;
            text-decoration: none; font-weight: 600; margin-bottom: 24px; }
        h1 { font-family: 'Montserrat', sans-serif; font-size: 1.9rem; margin-bottom: 8px; }
        p { line-height: 1.7; margin-bottom: 18px; }
    </style>
</head>
<body>
<div class="guide-detail-container">
    <a th:href="@{/guides}" class="back-link"><i class="fas fa-arrow-left"></i> Volver a Guías</a>
    <h1 th:text="${titulo}">Título de la guía</h1>
    <p th:each="parrafo : ${parrafos}" th:text="${parrafo}">Párrafo</p>
</div>
</body>
</html>
